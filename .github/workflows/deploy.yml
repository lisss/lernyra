name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    # Set repository variable DEPLOY_ENABLED=true after EC2 + secrets are ready.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ vars.APP_DIR }}"
            APP_DIR="${APP_DIR:-/opt/lernyra}"
            for old in /opt/beacon /opt/medeina /opt/pathquire /opt/casty /opt/cast /opt/jobify; do
              if [ -d "$old" ] && [ ! -e "$APP_DIR" ]; then
                sudo mv "$old" "$APP_DIR"
              fi
            done
            cd "$APP_DIR"
            git remote set-url origin https://github.com/${{ github.repository }}.git 2>/dev/null || true
            git fetch --depth 1 origin main
            git reset --hard origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin


            IMAGE="ghcr.io/${{ github.repository }}:latest"
            if grep -q '^IMAGE=' .env 2>/dev/null; then
              sed -i "s|^IMAGE=.*|IMAGE=${IMAGE}|" .env
            else
              echo "IMAGE=${IMAGE}" >> .env
            fi

            # Keep DuckDNS updater running when a token is configured on the host.
            COMPOSE=(docker compose -f docker-compose.prod.yml --env-file .env)
            if grep -q '^DUCKDNS_TOKEN=.\+' .env 2>/dev/null; then
              COMPOSE+=(--profile duckdns)
            fi

            docker image prune -af
            "${COMPOSE[@]}" pull
            docker rm -f lernyra-caddy lernyra-api lernyra-duckdns beacon-caddy beacon-api beacon-duckdns 2>/dev/null || true
            "${COMPOSE[@]}" up -d --force-recreate --remove-orphans
            docker image prune -f
            "${COMPOSE[@]}" ps
