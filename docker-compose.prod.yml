services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: lernyra-duckdns
    restart: unless-stopped
    profiles: ["duckdns"]
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
      TZ: UTC
      UPDATE_IP: ipv4
    logging:
      options:
        max-size: "2m"
        max-file: "2"

  caddy:
    image: caddy:2-alpine
    container_name: lernyra-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      options:
        max-size: "2m"
        max-file: "2"

  api:
    image: ${IMAGE:-ghcr.io/lisss/lernyra:latest}
    container_name: lernyra-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      PORT: "8000"
      # SQLite keeps a t3.micro under ~1GB RAM; swap to Postgres later if you upgrade.
      DATABASE_URL: sqlite:////data/lernyra.db
      API_CORS_ORIGINS: https://${DOMAIN},http://${DOMAIN},https://getmedeina.duckdns.org,http://getmedeina.duckdns.org,https://pathquire.duckdns.org,http://pathquire.duckdns.org,https://getcast.duckdns.org,http://getcast.duckdns.org
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://${DOMAIN}}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      REMOTIVE_ENABLED: ${REMOTIVE_ENABLED:-true}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    volumes:
      - api_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 25s
    logging:
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  api_data:
  caddy_data:
  caddy_config:
